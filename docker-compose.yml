services:
    search-engine:
        build: .
        ports:
            - 6000:8000
        restart: unless-stopped
        env_file: .env
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - nfdi-infra

    worker:
        build: .
        command: ["celery", "-A", "main.celery_app", "worker", "--loglevel=INFO"]
        restart: unless-stopped
        env_file: .env
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - nfdi-infra

    beat:
        build: .
        command: ["celery", "-A", "main.celery_app", "beat", "--loglevel=INFO"]
        restart: unless-stopped
        deploy:
            replicas: 1
        env_file: .env
        environment:
            CELERY_BEAT_SCHEDULE_FILE: /var/lib/celery/celerybeat-schedule
        volumes:
            - beat-schedule:/var/lib/celery
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - nfdi-infra

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", ""]
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - nfdi-infra

volumes:
    beat-schedule:

networks:
    # created by compose.infra.yml. The dev overlay replaces this with a local network
    nfdi-infra:
        name: nfdi-infra
        external: true
